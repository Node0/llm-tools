<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TTS Model Inspector</title>

<style>
:root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --danger: #f87171;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem;
}

.container {
    max-width: 900px;
    margin: auto;
}

.card {
    background: var(--panel);
    padding: 1.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 2rem;
}

input, button {
    padding: 0.7rem;
    border-radius: 8px;
    border: none;
    font-size: 0.9rem;
}

input {
    width: 100%;
    margin-bottom: 1rem;
    background: #0f172a;
    color: var(--text);
    border: 1px solid #334155;
}

button {
    background: var(--accent);
    color: #000;
    cursor: pointer;
    font-weight: 600;
    transition: 0.2s ease;
}

button:hover {
    opacity: 0.85;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
}

th, td {
    padding: 0.75rem;
    text-align: left;
}

th {
    color: var(--accent);
    border-bottom: 1px solid #334155;
}

td {
    border-bottom: 1px solid #1e293b;
    color: var(--muted);
}

.error {
    color: var(--danger);
    margin-top: 1rem;
}

.success {
    color: var(--accent);
}
</style>
</head>

<body>
<div class="container">
    <div class="card">
        <h2>TTS Model Inspector</h2>
        <input type="password" id="apiKey" placeholder="Enter OpenAI API Key" />
        <input type="text" id="baseUrl" placeholder="Optional Base URL (default https://api.openai.com/v1)" />
        <button id="inspectBtn">Inspect TTS Models</button>
        <div id="status"></div>
    </div>

    <div class="card">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Model ID</th>
                    <th>Owned By</th>
                    <th>Created (Unix)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module">
class TTSInspector {
    constructor() {
        this.apiKeyInput = document.getElementById("apiKey");
        this.baseUrlInput = document.getElementById("baseUrl");
        this.inspectBtn = document.getElementById("inspectBtn");
        this.statusDiv = document.getElementById("status");
        this.tableBody = document.querySelector("#resultsTable tbody");

        this.inspectBtn.addEventListener("click", () => this.inspect());
    }

    async inspect() {
        const apiKey = this.apiKeyInput.value.trim();
        const baseUrl = this.baseUrlInput.value.trim() || "https://api.openai.com/v1";

        if (!apiKey) {
            this.setStatus("API key required.", true);
            return;
        }

        this.setStatus("Fetching models...", false);
        this.clearTable();

        try {
            const models = await this.fetchModels(apiKey, baseUrl);
            const ttsModels = this.filterTTSModels(models);

            if (ttsModels.length === 0) {
                this.setStatus("No TTS models found.", false);
            } else {
                this.renderTable(ttsModels);
                this.setStatus(`Found ${ttsModels.length} TTS model(s).`, false);
            }

        } catch (err) {
            this.setStatus(err.message, true);
        }
    }

    async fetchModels(apiKey, baseUrl) {
        const response = await fetch(`${baseUrl}/models`, {
            headers: {
                "Authorization": `Bearer ${apiKey}`
            }
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error?.message || "API request failed.");
        }

        return data.data;
    }

    filterTTSModels(models) {
        return models.filter(m => m.id.toLowerCase().includes("tts"));
    }

    renderTable(models) {
        models.forEach(model => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${model.id}</td>
                <td>${model.owned_by}</td>
                <td>${model.created}</td>
            `;

            this.tableBody.appendChild(row);
        });
    }

    clearTable() {
        this.tableBody.innerHTML = "";
    }

    setStatus(message, isError) {
        this.statusDiv.className = isError ? "error" : "success";
        this.statusDiv.textContent = message;
    }
}

new TTSInspector();
</script>

</body>
</html>
